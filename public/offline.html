<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#3e4448" />
    <title>Remus · offline</title>
    <style>
      html, body { margin: 0; height: 100%; background: #3e4448; color: #fff; font-family: Inter, -apple-system, system-ui, sans-serif; }
      main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 24px; box-sizing: border-box; }
      img { width: 72px; height: 72px; border-radius: 16px; margin-bottom: 20px; }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { margin: 0 0 24px; color: rgba(255,255,255,.7); font-size: 15px; line-height: 1.5; max-width: 22rem; }
      button { font: inherit; font-weight: 600; background: #fff; color: #3e4448; border: 0; border-radius: 10px; padding: 12px 22px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/brand/remus-icon-192.png" alt="" />
      <h1>No connection</h1>
      <p>Remus needs the internet to load your quotes, projects and mail. It will open as soon as you have signal again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
