# Remus · Handover 8: "get told when it breaks" (copied from Raptor's .github/workflows/checks.yml, 55a7520).
#
# Runs every check on every push and pull request. When one fails, GitHub emails whoever pushed and puts a red X on
# the commit -- so a broken build is known before Vercel ships it. No secrets: nothing here talks to the real
# database, Vercel or email. The browser tour answers the database from fixtures (scripts/qa/e2e/harness.mjs).
name: QA

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run qa -- --fast

  # The robot's tour of every page, on a phone and a desk. Raptor's runs only once it has a login in the repo's
  # secrets; Remus's needs none, so it runs every time the checks pass.
  browser:
    name: Browser tour
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: |
          npm ci
          npm install -g playwright@1.63.0
          playwright install --with-deps chromium
      - run: npm run qa
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: qa-screenshots
          path: .qa-screenshots
